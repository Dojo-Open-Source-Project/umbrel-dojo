manifestVersion: 1
id: dojo
category: bitcoin
name: Dojo
version: "1.29.3-patch.9"
tagline: Your own private backend for Ashigaru, Sentinel and Samourai
description: >-
  Dojo indexes your own wallets against your own Bitcoin node, so the addresses
  and balances you look up never leave your Umbrel. Pair a wallet to it and
  nobody else learns which coins are yours.


  Requires a Bitcoin node, an Electrum server and Mempool — install those
  first. Pick Fulcrum as the Electrum server: it answers batched requests, so
  importing and rescanning an xpub takes a fraction of the time it does on
  Electrs. Umbrel lists this requirement as Electrs, with Fulcrum among its
  alternatives.


  Dojo uses your Bitcoin node for everything else, and Mempool as the block
  explorer your paired wallets open transactions in, so you are not handing
  your transaction history to a public explorer either.


  Open the app to pair a wallet. It shows a QR code you can scan from Ashigaru
  Wallet, Samourai Wallet or Sentinel, and a Tor endpoint you can paste into
  wallets that ask for a server URL. Tor means your wallet reaches your Dojo
  from anywhere, not only at home.


  Dojo also runs a Soroban node. Transactions you broadcast are handed to a
  random node on the Soroban network, which relays them to Bitcoin — so the
  node that announces your transaction is not your own, and cannot be linked
  back to you.


  Whirlpool is not included. Its coordinator was shut down in 2024 and the
  service no longer exists.
releaseNotes: >-
  The app's page is now three tabs with a bar along the bottom, the way
  umbrelOS's own apps work. Home is the glance: whether Dojo is working, what
  the next block costs, and the wallets you have paired. Tools holds looking up
  a wallet or address and the two rescans. Advanced holds the admin key and the
  Maintenance Tool. Pair wallet stays in the corner on every tab.


  Home now shows next block fees on the page itself, the same four figures as
  the home-screen widget: the rate at which a transaction has a 50%, 90%, 99%
  or 99.9% chance of being confirmed in the very next block. They come from the
  nextblock estimator running against your own node, so you are not asking
  anyone else what the fees are.


  You can also now choose how Dojo broadcasts, in umbrelOS under this app's
  settings. By default your transactions are handed to a random node on the
  Soroban network, so the node that announces yours is not your own. You can
  turn that off, or turn on relaying other people's transactions as well —
  which also publishes an inbound address for other nodes to reach. The
  Advanced tab shows which of these are in force.
developer: Dojo Open Source Project
website: https://github.com/Dojo-Open-Source-Project
dependencies:
  - bitcoin
  - electrs
  - mempool
repo: https://github.com/Dojo-Open-Source-Project/samourai-dojo
support: https://github.com/Dojo-Open-Source-Project/samourai-dojo/issues

port: 3023
gallery: []
path: ""

# User-configurable settings, rendered by umbrelOS in this app's own settings.
#
# This is the only honest home for them: keys.index.js computes Dojo's PandoTx
# configuration once at module load from these variables, and nothing in Dojo's
# API can change it afterwards, so a control on the app's own page would do
# nothing. umbrelOS stores the choice, injects it, and restarts the app -- which
# is exactly what applying it requires.
#
# Both services are listed on purpose. umbrelOS injects an override only into
# the services named, and the Connect page learns these values through nginx's
# environment; naming only `node` would leave the page reporting a stale value
# after a change.
environment:
  - name: NODE_PANDOTX_PUSH
    services:
      - node
      - nginx
    default: "on"
    options:
      - "on"
      - "off"
    note: Hand transactions you broadcast to a random node on the Soroban network, so the node that announces yours is not your own and cannot be linked to you. Turning this off means your own node announces them.
  - name: NODE_PANDOTX_PROCESS
    services:
      - node
      - nginx
    default: "off"
    options:
      - "on"
      - "off"
    note: Relay other people's transactions as well as your own. This also requires SOROBAN_ANNOUNCE, since relaying means publishing an inbound Soroban address for other nodes to reach — it changes what this machine does on the network, so it is off by default.
  - name: SOROBAN_ANNOUNCE
    services:
      - node
      - soroban
      - nginx
    default: "off"
    options:
      - "on"
      - "off"
    note: Publish an inbound Soroban address so other nodes can reach this one. Needed only to relay other people's transactions; broadcasting your own works without it.

widgets:
  - id: "fees"
    type: "four-stats"
    # Dojo's estimator recomputes every 20 seconds (estimator/index.js sets
    # refresh: 20), so polling faster than this only repeats an answer.
    refresh: "30s"
    # The compose service name, which umbrelOS resolves to this app's own
    # container -- so it is correct under any app id. Port 3000 is not
    # published to the host.
    endpoint: "widget:3000/widgets/fees"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "50% chance"
          text: "3"
          subtext: "sat/vB"
        - title: "90% chance"
          text: "5"
          subtext: "sat/vB"
        - title: "99% chance"
          text: "8"
          subtext: "sat/vB"
        - title: "99.9% chance"
          text: "12"
          subtext: "sat/vB"

defaultUsername: ""
defaultPassword: ""

submitter: linkinparkrulz
