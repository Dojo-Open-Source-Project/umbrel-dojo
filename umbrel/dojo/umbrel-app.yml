id: dojo
category: bitcoin
name: Dojo
version: "1.29.3-patch.5"
tagline: Your own private backend for Ashigaru and Samourai
description: >-
  Dojo indexes your own wallets against your own Bitcoin node, so the addresses
  and balances you look up never leave your Umbrel. Pair a wallet to it and
  nobody else learns which coins are yours.


  Requires a Bitcoin node, an Electrum server and Mempool — install those
  first. Pick Fulcrum as the Electrum server: it answers batched requests, so
  importing and rescanning an xpub takes a fraction of the time it does on
  Electrs. Umbrel lists this requirement as Electrs, with Fulcrum among its
  alternatives.


  Dojo uses your Bitcoin node for everything else, and Mempool as the block
  explorer your paired wallets open transactions in, so you are not handing
  your transaction history to a public explorer either.


  Open the app to pair a wallet. It shows a QR code you can scan from Ashigaru
  Wallet, Samourai Wallet or Sentinel, and a Tor endpoint you can paste into
  wallets that ask for a server URL. Tor means your wallet reaches your Dojo
  from anywhere, not only at home.


  Dojo also runs a Soroban node. Transactions you broadcast are handed to a
  random node on the Soroban network, which relays them to Bitcoin — so the
  node that announces your transaction is not your own, and cannot be linked
  back to you.


  Whirlpool is not included. Its coordinator was shut down in 2024 and the
  service no longer exists.
releaseNotes: >-
  Fixes a broken page after the last update. If the app came back looking
  unstyled, with bulleted lists where the status panel should be, and the
  block height stuck on "Waiting for Dojo…", that is this bug. Your browser had
  kept the previous version's stylesheet and script and paired them with the
  new page, and the old script stops at the first thing it cannot find — which
  is why the page sat there rather than merely looking wrong.


  Nothing was wrong with your Dojo: it carried on indexing throughout, and a
  hard refresh was enough to clear it. This update makes that impossible rather
  than asking anyone to know about it, so the page now updates cleanly from
  here on.


  Everything from the previous update is in this one, so if you have not seen
  the rebuilt page yet, this is where it arrives.


  Also fixes the Bitcoin node indicator, which showed red on a node that was
  working. The page was reading the node's figures from the wrong place in the
  reply, so it never found them: the light went red and the chain line fell
  back to "Indexed by your Dojo" instead of comparing your Dojo's height
  against your node's. Nothing was wrong with the node, and nothing was wrong
  with the indexing — only with the reading of it. This one predates the
  redesign; it was simply easier to miss as one small dot among four.
