manifestVersion: 1
id: dojo
category: bitcoin
name: Dojo
version: "1.29.3-patch.7"
tagline: Your own private backend for Ashigaru, Sentinel and Samourai
description: >-
  Dojo indexes your own wallets against your own Bitcoin node, so the addresses
  and balances you look up never leave your Umbrel. Pair a wallet to it and
  nobody else learns which coins are yours.


  Requires a Bitcoin node, an Electrum server and Mempool — install those
  first. Pick Fulcrum as the Electrum server: it answers batched requests, so
  importing and rescanning an xpub takes a fraction of the time it does on
  Electrs. Umbrel lists this requirement as Electrs, with Fulcrum among its
  alternatives.


  Dojo uses your Bitcoin node for everything else, and Mempool as the block
  explorer your paired wallets open transactions in, so you are not handing
  your transaction history to a public explorer either.


  Open the app to pair a wallet. It shows a QR code you can scan from Ashigaru
  Wallet, Samourai Wallet or Sentinel, and a Tor endpoint you can paste into
  wallets that ask for a server URL. Tor means your wallet reaches your Dojo
  from anywhere, not only at home.


  Dojo also runs a Soroban node. Transactions you broadcast are handed to a
  random node on the Soroban network, which relays them to Bitcoin — so the
  node that announces your transaction is not your own, and cannot be linked
  back to you.


  Whirlpool is not included. Its coordinator was shut down in 2024 and the
  service no longer exists.
releaseNotes: >-
  Every wallet you pair from now on gets its own key. Lose a phone and you
  revoke that one wallet; everything else keeps syncing. Until now Dojo handed
  out a single shared key, so cutting off one wallet meant re-pairing all of
  them — or living with it.


  Pairing now asks what to call the wallet first, then shows a code made for
  it. The Paired wallets card lists what you have given access to, and each one
  can be revoked on its own or removed once you no longer want the record.
  Revoking takes effect immediately. Keys can also be given a lifetime, ten
  years by default.


  The wallets you have already paired are unaffected and keep working. They
  share the key Umbrel derived for this app, which is still listed, still
  works, and still cannot be revoked from here.


  Dojo also has a home-screen widget now, showing what it costs to get into
  the next block: four feerates, each the rate at which a transaction has a
  50%, 90%, 99% or 99.9% chance of being confirmed in the very next block.
  These are not generic fee bands — they come from the nextblock estimator,
  the algorithm behind nextblock.is, which Dojo has been running against your
  own node all along. The figures are worked out from your node's own view of
  the mempool, so you are not asking anyone else what the fees are. Add it from
  the widget picker on your Umbrel home screen.
developer: Dojo Open Source Project
website: https://github.com/Dojo-Open-Source-Project
dependencies:
  - bitcoin
  - electrs
  - mempool
repo: https://github.com/Dojo-Open-Source-Project/samourai-dojo
support: https://github.com/Dojo-Open-Source-Project/samourai-dojo/issues

port: 3023
gallery: []
path: ""

widgets:
  - id: "fees"
    type: "four-stats"
    # Dojo's estimator recomputes every 20 seconds (estimator/index.js sets
    # refresh: 20), so polling faster than this only repeats an answer.
    refresh: "30s"
    # The compose service name, which umbrelOS resolves to this app's own
    # container -- so it is correct under any app id. Port 3000 is not
    # published to the host.
    endpoint: "widget:3000/widgets/fees"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "50% chance"
          text: "3"
          subtext: "sat/vB"
        - title: "90% chance"
          text: "5"
          subtext: "sat/vB"
        - title: "99% chance"
          text: "8"
          subtext: "sat/vB"
        - title: "99.9% chance"
          text: "12"
          subtext: "sat/vB"

defaultUsername: ""
defaultPassword: ""

submitter: linkinparkrulz
