manifestVersion: 1
id: dojo
category: bitcoin
name: Dojo
version: "1.29.3-patch.2"
tagline: Your own private backend for Ashigaru and Samourai
description: >-
  Dojo indexes your own wallets against your own Bitcoin node, so the addresses
  and balances you look up never leave your Umbrel. Pair a wallet to it and
  nobody else learns which coins are yours.


  Requires a Bitcoin node, an Electrum server (Electrs or Fulcrum) and Mempool
  — install those first. Dojo uses the Electrum server to import and rescan
  xpubs quickly, your Bitcoin node for everything else, and Mempool as the
  block explorer your paired wallets open transactions in, so you are not
  handing your transaction history to a public explorer either.


  Open the app to pair a wallet. It shows a QR code you can scan from Ashigaru
  Wallet, Samourai Wallet or Sentinel, and a Tor endpoint you can paste into
  wallets that ask for a server URL. Tor means your wallet reaches your Dojo
  from anywhere, not only at home.


  Dojo also runs a Soroban node. Transactions you broadcast are handed to a
  random node on the Soroban network, which relays them to Bitcoin — so the
  node that announces your transaction is not your own, and cannot be linked
  back to you.


  Whirlpool is not included. Its coordinator was shut down in 2024 and the
  service no longer exists.
releaseNotes: >-
  Wallets you pair now get a block explorer: your own Mempool, rather than a
  public one. Opening a transaction from a paired wallet no longer tells a
  stranger's server which transactions are yours. Mempool is required from this
  version on, so Umbrel will offer to install it.


  Wallet instructions now cover Samourai Wallet alongside Ashigaru and
  Sentinel.


  Pairing over your local network is still available, now under "Pair over your
  local network instead" rather than as an equal choice. Tor is the default
  because a wallet stores one address: pair over the local network and that
  wallet stops reaching your Dojo as soon as you leave the house.


  The Maintenance Tool button opens over Tor. It needs Tor Browser — an .onion
  address will not load in an ordinary browser — and it stays disabled until
  Tor has published the address.
