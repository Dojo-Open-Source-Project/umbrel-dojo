services:
  app_proxy:
    environment:
      APP_HOST: dojo_nginx_1
      APP_PORT: 8081

  db:
    image: ghcr.io/linkinparkrulz/dojo-db:1.7.0-umbrel1@sha256:643eecef25d58bfcfef15b1be5cc7f6d3ad247ebe9a39b720a38fc0c82de5d92
    init: true
    restart: on-failure
    user: "1000:1000"
    # Dojo's tracker writes continuously; give MariaDB room to flush cleanly.
    stop_grace_period: 5m
    environment:
      MYSQL_DATABASE: samourai-main
      MYSQL_USER: samourai
      MYSQL_PASSWORD: ${APP_DOJO_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${APP_DOJO_MYSQL_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "true"
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 6

  node:
    image: ghcr.io/linkinparkrulz/dojo-nodejs:1.29.3-umbrel1@sha256:6870de9a746fc7cdb04a5c64aabcc424bca618cb69b1a05a1759d9cbe6f4514f
    init: true
    restart: on-failure
    user: "1000:1000"
    # Dojo reads its own onion address from /var/lib/tor/hsv3dojo/hostname at
    # import time and uses it to build the auth47 callback URL. Give Tor a
    # bounded chance to publish it on a first install so auth47 is live
    # straight away; Dojo starts fine without it either way.
    command: sh -c 'n=0; while [ ! -f /var/lib/tor/hsv3dojo/hostname ] && [ $$n -lt 60 ]; do n=$$((n+1)); sleep 2; done; exec /home/node/app/wait-for-it.sh dojo_db_1:3306 --timeout=720 --strict -- /home/node/app/restart.sh'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Dojo expects its own hidden service here. The path is fixed because the
      # app id is fixed; hooks/pre-start creates it so Docker cannot make it
      # root-owned and lock Tor out of it.
      - ${TOR_DATA_DIR}/app-dojo-api:/var/lib/tor/hsv3dojo:ro
    environment:
      # pm2 keeps its state under $HOME; without this it lands on / and the
      # process manager cannot start.
      HOME: /home/node

      # GLOBAL
      COMMON_BTC_NETWORK: ${APP_DOJO_BTC_NETWORK}
      DOJO_VERSION_TAG: 1.29.3
      NET_DOJO_MYSQL_IPV4: dojo_db_1
      NET_DOJO_TOR_IPV4: ${TOR_PROXY_IP}
      TOR_SOCKS_PORT: ${TOR_PROXY_PORT}

      # MYSQL
      MYSQL_DATABASE: samourai-main
      MYSQL_USER: samourai
      MYSQL_PASSWORD: ${APP_DOJO_MYSQL_PASSWORD}

      # BITCOIN -- Umbrel's Bitcoin Node app
      BITCOIND_IP: ${APP_BITCOIN_NODE_IP}
      BITCOIND_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      BITCOIND_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIND_RPC_PASSWORD: ${APP_BITCOIN_RPC_PASS}
      BITCOIND_ZMQ_RAWTXS: ${APP_BITCOIN_ZMQ_RAWTX_PORT}
      BITCOIND_ZMQ_BLK_HASH: ${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}

      # INDEXER -- Umbrel's Electrs app, or any app implementing it (Fulcrum).
      # INDEXER_INSTALL stays unset on purpose: that branch reads a Tor
      # hostname file that only exists when Dojo runs its own bundled indexer.
      NODE_ACTIVE_INDEXER: local_indexer
      INDEXER_IP: ${APP_ELECTRS_NODE_IP}
      INDEXER_RPC_PORT: ${APP_ELECTRS_NODE_PORT}
      INDEXER_PROTOCOL: tcp
      INDEXER_BATCH_SUPPORT: ${APP_DOJO_INDEXER_BATCH_SUPPORT}

      # EXPLORER -- Umbrel ships Mempool and BTC RPC Explorer as their own apps
      EXPLORER_INSTALL: "off"

      # SOROBAN / PandoTx
      # Pushed transactions are relayed by a random Soroban node instead of
      # this one, so the broadcasting node is not linkable to the sender.
      # ANNOUNCE stays off: announcing would publish this node's onion address
      # as a public Soroban relay, which is not a sensible default for a home
      # server. PROCESS requires ANNOUNCE, so it is off too.
      SOROBAN_INSTALL: "on"
      SOROBAN_ANNOUNCE: "off"
      NET_DOJO_SOROBAN_IPV4: dojo_soroban_1
      SOROBAN_PORT: ${APP_DOJO_SOROBAN_PORT}
      SOROBAN_ANNOUNCE_KEY_MAIN: soroban.cluster.mainnet.nodes
      SOROBAN_ANNOUNCE_KEY_TEST: soroban.cluster.testnet.nodes
      NODE_PANDOTX_PUSH: "on"
      NODE_PANDOTX_PROCESS: "off"
      NODE_PANDOTX_FALLBACK_MODE: convenient
      NODE_PANDOTX_NB_RETRIES: 2

      # SECURITY
      NODE_API_KEY: ${APP_DOJO_NODE_API_KEY}
      NODE_ADMIN_KEY: ${APP_DOJO_NODE_ADMIN_KEY}
      NODE_JWT_SECRET: ${APP_DOJO_NODE_JWT_SECRET}
      NODE_PAYMENT_CODE: ""

      # NODEJS -- upstream defaults (docker/my-dojo/.env at v1.29.3)
      NODE_GAP_EXTERNAL: 100
      NODE_GAP_INTERNAL: 100
      NODE_ADDR_FILTER_THRESHOLD: 1000
      NODE_ADDR_DERIVATION_MIN_CHILD: 2
      NODE_ADDR_DERIVATION_MAX_CHILD: 2
      NODE_ADDR_DERIVATION_THRESHOLD: 10
      NODE_TXS_SCHED_MAX_ENTRIES: 10
      NODE_TXS_SCHED_MAX_DELTA_HEIGHT: 18
      NODE_JWT_ACCESS_EXPIRES: 900
      NODE_JWT_REFRESH_EXPIRES: 7200
      NODE_PREFIX_STATUS: status
      NODE_PREFIX_SUPPORT: support
      NODE_PREFIX_STATUS_PUSHTX: status
      NODE_TRACKER_MEMPOOL_PERIOD: 10000
      NODE_TRACKER_UNCONF_TXS_PERIOD: 300000
      NODE_FEE_TYPE: ECONOMICAL
      NODE_URL_OXT_API: https://api.oxt.me
      NODE_URL_ESPLORA_API: https://blockstream.info/testnet

  soroban:
    image: ghcr.io/linkinparkrulz/dojo-soroban:0.4.2-umbrel1@sha256:aa67210dae2934ce5ba08ecb56631dbb0087d2a1699d2632429789088298b290
    init: true
    restart: on-failure
    user: "1000:1000"
    env_file:
      - ${APP_DATA_DIR}/soroban.env
    environment:
      # Soroban runs its own Tor daemon, which needs a writable home.
      HOME: /home/soroban
      COMMON_BTC_NETWORK: ${APP_DOJO_BTC_NETWORK}
      NET_DOJO_SOROBAN_IPV4: dojo_soroban_1
      SOROBAN_PORT: ${APP_DOJO_SOROBAN_PORT}
      SOROBAN_ANNOUNCE: "off"
    volumes:
      - ${APP_DATA_DIR}/data/soroban:/home/soroban/data

  nginx:
    image: ghcr.io/linkinparkrulz/dojo-nginx:1.29.3-umbrel1@sha256:c517fd87109fa99496117ccacee799781f71d31c296b70ba70d9e17381de8f98
    init: true
    restart: on-failure
    user: "1000:1000"
    depends_on:
      - node
    environment:
      COMMON_BTC_NETWORK: ${APP_DOJO_BTC_NETWORK}
      DOJO_VERSION_TAG: 1.29.3
      DOJO_API_PORT: ${APP_DOJO_API_PORT}
      DOJO_HIDDEN_SERVICE: ${APP_DOJO_HIDDEN_SERVICE}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
      NODE_ADMIN_KEY: ${APP_DOJO_NODE_ADMIN_KEY}
      NODE_PREFIX_SUPPORT: support
      NODE_HOST: dojo_node_1
    ports:
      # The Dojo API, for wallets on the same network. The Connect UI on 8081
      # is not published here -- Umbrel's app_proxy fronts it, so it stays
      # behind the user's Umbrel login.
      - "${APP_DOJO_API_PORT}:8080"
    networks:
      default:
        # Fixed so torrc can point the hidden service at it.
        ipv4_address: ${APP_DOJO_NGINX_IP}

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
