# Dojo API (mainnet) -- port 8080.
#
# Reachable over the app's Tor hidden service and, when the package publishes
# it, on the LAN. Ported from upstream docker/my-dojo/nginx/mainnet.conf at
# v1.29.3, with two Umbrel additions marked below.

# Proxy WebSockets
# https://www.nginx.com/blog/websocket-nginx/
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# WebSocket server listening here
upstream websocket {
    server ${NODE_HOST}:8080;
}

server {
    # 8080, not 80: the container runs as an unprivileged UID and cannot bind
    # a privileged port. The Tor hidden service and the published host port both
    # map their port 80 onto this one.
    listen 8080;
    server_name _;

    # Set proxy timeouts for the application
    proxy_connect_timeout 600;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
    send_timeout 600;

    # Proxy WebSocket connections first
    location /v2/inv {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # PushTX server is separate, so proxy first
    location /v2/pushtx/ {
        proxy_pass http://${NODE_HOST}:8081/;
    }

    # Tracker server is separate, so proxy first
    location /v2/tracker/ {
        proxy_pass http://${NODE_HOST}:8082/;
    }

    # umbrel: upstream's installer copies the network-specific admin config to
    # static/admin/conf/index.js on the host before building the node image,
    # which would bake a network choice into the image. We serve it per network
    # from here instead, so one image works for mainnet and testnet.
    location = /admin/conf/index.js {
        proxy_pass http://${NODE_HOST}:8080/static/admin/conf/index-mainnet.js;
    }

    # Proxy requests to maintenance tool
    location /admin/ {
        proxy_pass http://${NODE_HOST}:8080/static/admin/;
    }

    # Proxy all other v2 requests to the accounts server
    location /v2/ {
        proxy_pass http://${NODE_HOST}:8080/;
    }

    # Redirect to the maintenance tool
    location = / {
        return 301 $scheme://$http_host/admin/;
    }

    # Serve remaining requests
    location / {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
