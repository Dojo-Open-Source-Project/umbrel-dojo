# Connect UI -- port 8081.
#
# This is what Umbrel's app_proxy points at, so it sits behind the user's
# Umbrel login. It serves the static pairing page and proxies the two Dojo API
# calls the page needs, same-origin, so the page never has to reach across to
# the published API port (and never needs CORS).

server {
    listen 8081;
    server_name _;

    root /var/www/connect;
    index index.html;

    proxy_connect_timeout 60;
    proxy_read_timeout 60;

    # Admin login -- exchanges the admin key for a short-lived JWT.
    location = /v2/auth/login {
        proxy_pass http://${NODE_HOST}:8080/auth/login;
    }

    location = /test/v2/auth/login {
        proxy_pass http://${NODE_HOST}:8080/auth/login;
    }

    # Wallet deletion is reachable under the support prefix as a plain GET.
    # This page is behind Umbrel auth and every call still needs the admin JWT,
    # but a one-click page should not be able to drop an account by accident,
    # so it is refused here. The Maintenance Tool still offers it deliberately.
    # Regex locations win over the prefix ones below.
    location ~ ^/(test/)?v2/support/xpub/[^/]+/delete$ {
        return 404;
    }

    # Pairing payload for the QR code.
    location /v2/support/pairing {
        proxy_pass http://${NODE_HOST}:8080/support/pairing;
    }

    location /test/v2/support/pairing {
        proxy_pass http://${NODE_HOST}:8080/support/pairing;
    }

    # Wallet and address tools: /info and /rescan.
    #
    # A rescan is synchronous: accounts/support-rest-api.js awaits
    # hdaService.rescan() and only then answers "Rescan complete". A large
    # wallet takes minutes, so the 60s default above would cut the connection
    # and hand the user a 504 while Dojo carried on working -- a failure that
    # looks like breakage and is not one. These four locations get an hour.
    #
    # It is a ceiling, not a delay: /info still answers as fast as it always
    # did. Only a request that genuinely runs long is allowed to.
    location /v2/support/xpub/ {
        proxy_read_timeout 3600;
        proxy_pass http://${NODE_HOST}:8080/support/xpub/;
    }

    location /test/v2/support/xpub/ {
        proxy_read_timeout 3600;
        proxy_pass http://${NODE_HOST}:8080/support/xpub/;
    }

    location /v2/support/address/ {
        proxy_read_timeout 3600;
        proxy_pass http://${NODE_HOST}:8080/support/address/;
    }

    location /test/v2/support/address/ {
        proxy_read_timeout 3600;
        proxy_pass http://${NODE_HOST}:8080/support/address/;
    }

    # Block-range rescan. The tracker is a separate service on its own port,
    # exactly as the main site config treats it (/v2/tracker/ -> :8082). This
    # is the one recovery action nothing else on the page can do, and it is
    # long-running by nature, so it gets the same hour the xpub rescans get.
    location /v2/tracker/support/rescan {
        proxy_read_timeout 3600;
        proxy_pass http://${NODE_HOST}:8082/support/rescan;
    }

    location /test/v2/tracker/support/rescan {
        proxy_read_timeout 3600;
        proxy_pass http://${NODE_HOST}:8082/support/rescan;
    }

    # Per-wallet API keys.
    #
    # The whole CRUD surface already exists in Dojo
    # (accounts/support-rest-api.js:100-125): GET /support/apikeys lists them,
    # POST /support/apikey mints one, PATCH and DELETE on
    # /support/apikey/:apikey revoke and remove. All four require the admin
    # profile, which this page already holds. These locations are the only
    # thing that was missing.
    #
    # Two prefixes rather than one because nginx picks the longest match: the
    # bare `apikey` prefix would in fact serve `apikeys` correctly by string
    # replacement, but relying on that makes the routing depend on a detail
    # nobody reading it would check.
    location /v2/support/apikeys {
        proxy_pass http://${NODE_HOST}:8080/support/apikeys;
    }

    location /test/v2/support/apikeys {
        proxy_pass http://${NODE_HOST}:8080/support/apikeys;
    }

    location /v2/support/apikey {
        proxy_pass http://${NODE_HOST}:8080/support/apikey;
    }

    location /test/v2/support/apikey {
        proxy_pass http://${NODE_HOST}:8080/support/apikey;
    }

    # Dojo status, used for the service indicators on the page.
    location /v2/status {
        proxy_pass http://${NODE_HOST}:8080/status;
    }

    location /test/v2/status {
        proxy_pass http://${NODE_HOST}:8080/status;
    }

    # PushTx status: this is where the Bitcoin node's own figures come from
    # (version, peer count, relay fee, chain) plus broadcast counts. Separate
    # service, separate port.
    location /v2/pushtx/status {
        proxy_pass http://${NODE_HOST}:8081/status;
    }

    location /test/v2/pushtx/status {
        proxy_pass http://${NODE_HOST}:8081/status;
    }

    # The Tor hidden-service hostname, straight off the mounted volume.
    #
    # exports.sh resolves this before any container exists, so on a first
    # install it can only ever report notyetset.onion -- and a container's
    # environment is fixed at creation, so that stale value would stick for the
    # life of the container. Serving the file instead lets the page poll for the
    # real address and fill itself in as soon as Tor publishes it. 404 until
    # then, which the page handles.
    location = /onion {
        default_type text/plain;
        alias /var/lib/tor/hsv3dojo/hostname;
    }

    # Connect UI static files
    location / {
        # Revalidate before use. nginx sends no Cache-Control for static files
        # by default, so a browser applies heuristic freshness and may serve a
        # cached stylesheet or script for hours without ever asking -- which is
        # how patch.4 shipped a page whose markup and script came from different
        # releases. "no-cache" is not "no-store": the file is still cached, it
        # just has to be revalidated, so an unchanged asset costs a 304.
        #
        # The hashed URLs stamped in at build time make this cheap rather than
        # load-bearing, but it is what keeps conf.js honest -- that one is
        # written per container and carries the onion address.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
