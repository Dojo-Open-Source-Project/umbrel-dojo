# Connect UI -- port 8081.
#
# This is what Umbrel's app_proxy points at, so it sits behind the user's
# Umbrel login. It serves the static pairing page and proxies the two Dojo API
# calls the page needs, same-origin, so the page never has to reach across to
# the published API port (and never needs CORS).

server {
    listen 8081;
    server_name _;

    root /var/www/connect;
    index index.html;

    proxy_connect_timeout 60;
    proxy_read_timeout 60;

    # Admin login -- exchanges the admin key for a short-lived JWT.
    location = /v2/auth/login {
        proxy_pass http://${NODE_HOST}:8080/auth/login;
    }

    location = /test/v2/auth/login {
        proxy_pass http://${NODE_HOST}:8080/auth/login;
    }

    # Pairing payload for the QR code.
    location /v2/support/pairing {
        proxy_pass http://${NODE_HOST}:8080/support/pairing;
    }

    location /test/v2/support/pairing {
        proxy_pass http://${NODE_HOST}:8080/support/pairing;
    }

    # Dojo status, used for the service indicators on the page.
    location /v2/status {
        proxy_pass http://${NODE_HOST}:8080/status;
    }

    location /test/v2/status {
        proxy_pass http://${NODE_HOST}:8080/status;
    }

    # Connect UI static files
    location / {
        try_files $uri $uri/ =404;
    }
}
