# Connect UI -- port 8081.
#
# This is what Umbrel's app_proxy points at, so it sits behind the user's
# Umbrel login. It serves the static pairing page and proxies the two Dojo API
# calls the page needs, same-origin, so the page never has to reach across to
# the published API port (and never needs CORS).

server {
    listen 8081;
    server_name _;

    root /var/www/connect;
    index index.html;

    proxy_connect_timeout 60;
    proxy_read_timeout 60;

    # Admin login -- exchanges the admin key for a short-lived JWT.
    location = /v2/auth/login {
        proxy_pass http://${NODE_HOST}:8080/auth/login;
    }

    location = /test/v2/auth/login {
        proxy_pass http://${NODE_HOST}:8080/auth/login;
    }

    # Wallet deletion is reachable under the support prefix as a plain GET.
    # This page is behind Umbrel auth and every call still needs the admin JWT,
    # but a one-click page should not be able to drop an account by accident,
    # so it is refused here. The Maintenance Tool still offers it deliberately.
    # Regex locations win over the prefix ones below.
    location ~ ^/(test/)?v2/support/xpub/[^/]+/delete$ {
        return 404;
    }

    # Pairing payload for the QR code.
    location /v2/support/pairing {
        proxy_pass http://${NODE_HOST}:8080/support/pairing;
    }

    location /test/v2/support/pairing {
        proxy_pass http://${NODE_HOST}:8080/support/pairing;
    }

    # Wallet and address tools: /info and /rescan.
    location /v2/support/xpub/ {
        proxy_pass http://${NODE_HOST}:8080/support/xpub/;
    }

    location /test/v2/support/xpub/ {
        proxy_pass http://${NODE_HOST}:8080/support/xpub/;
    }

    location /v2/support/address/ {
        proxy_pass http://${NODE_HOST}:8080/support/address/;
    }

    location /test/v2/support/address/ {
        proxy_pass http://${NODE_HOST}:8080/support/address/;
    }

    # Dojo status, used for the service indicators on the page.
    location /v2/status {
        proxy_pass http://${NODE_HOST}:8080/status;
    }

    location /test/v2/status {
        proxy_pass http://${NODE_HOST}:8080/status;
    }

    # PushTx status: this is where the Bitcoin node's own figures come from
    # (version, peer count, relay fee, chain) plus broadcast counts. Separate
    # service, separate port.
    location /v2/pushtx/status {
        proxy_pass http://${NODE_HOST}:8081/status;
    }

    location /test/v2/pushtx/status {
        proxy_pass http://${NODE_HOST}:8081/status;
    }

    # Connect UI static files
    location / {
        try_files $uri $uri/ =404;
    }
}
