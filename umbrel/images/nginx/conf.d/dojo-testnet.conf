# Dojo API (testnet) -- port 8080.
#
# Ported from upstream docker/my-dojo/nginx/testnet.conf at v1.29.3, with the
# Umbrel admin-config addition marked below.

# Proxy WebSockets
# https://www.nginx.com/blog/websocket-nginx/
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# WebSocket server listening here
upstream websocket {
    server node:8080;
}

server {
    # 8080, not 80: the container runs as an unprivileged UID and cannot bind
    # a privileged port. The Tor hidden service and the published host port both
    # map their port 80 onto this one.
    listen 8080;
    server_name _;

    # Set proxy timeouts for the application
    proxy_connect_timeout 600;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
    send_timeout 600;

    # Proxy WebSocket connections first
    location /test/v2/inv {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # PushTX server is separate, so proxy first
    location /test/v2/pushtx/ {
        proxy_pass http://node:8081/;
    }

    # Tracker server is separate, so proxy first
    location /test/v2/tracker/ {
        proxy_pass http://node:8082/;
    }

    # umbrel: see the note in dojo-mainnet.conf
    location = /admin/conf/index.js {
        proxy_pass http://node:8080/static/admin/conf/index-testnet.js;
    }

    # Proxy requests to maintenance tool
    location /admin/ {
        proxy_pass http://node:8080/static/admin/;
    }

    # Proxy all other v2 requests to the accounts server
    location /test/v2/ {
        proxy_pass http://node:8080/;
    }

    # Redirect to the maintenance tool
    location = / {
        return 301 $scheme://$http_host/admin/;
    }

    # Serve remaining requests
    location / {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    location /test/ {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
