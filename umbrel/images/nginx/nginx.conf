# No `user` directive: Umbrel runs this container as an unprivileged UID, so
# there is no master process running as root to drop privileges from.
worker_processes  auto;
daemon off;

# Log critical errors and higher to stderr
error_log  /dev/stderr crit;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable by any UID (see the note above)
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    # Disable activity logging for privacy.
    access_log  off;

    # Do not reveal the version of server
    server_tokens  off;

    sendfile  on;

    keepalive_timeout  95;

    # Enable response compression
    gzip  on;
    gzip_comp_level  4;
    gzip_disable  msie6;
    gzip_min_length  128;
    gzip_types  application/json application/javascript text/css image/svg+xml;
    gzip_vary  on;

    include  /etc/nginx/sites-enabled/*.conf;
}
