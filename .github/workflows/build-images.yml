# Builds the four images the Umbrel Dojo app runs and publishes them to GHCR
# as multi-arch manifest lists.
#
# Umbrel requires every image to be publicly pullable and to support both
# linux/amd64 and linux/arm64 (Raspberry Pi 4/5). Each arch is built on its own
# native runner and pushed by digest; a final job stitches the digests into one
# manifest list per image. Native beats QEMU by a wide margin here -- the
# Soroban image compiles Tor from source and builds a Go binary.
#
# Release tags look like `v1.29.3-umbrel1`: the upstream Dojo version, then the
# packaging revision. Images are tagged `<component version>-<revision>`, e.g.
# dojo-db:1.7.0-umbrel1, so a packaging-only rebuild never moves a tag that an
# installed app is pinned to.
name: Build images

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [nodejs, db, soroban, nginx]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build settings
        id: settings
        run: |
          set -euo pipefail
          # Component versions come from the vendored upstream .env, so they
          # cannot drift from the source tree being built.
          set -a
          . ./docker/my-dojo/.env
          set +a

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            revision="${GITHUB_REF_NAME#*-}"
          else
            revision="dev.${GITHUB_SHA::7}"
          fi

          case "${{ matrix.image }}" in
            nodejs)
              repository="dojo-nodejs"
              version="${DOJO_NODEJS_VERSION_TAG}"
              dockerfile="./docker/my-dojo/node/Dockerfile"
              context="."
              build_args="TOR_LINUX_GID=${TOR_LINUX_GID}"
              ;;
            db)
              repository="dojo-db"
              version="${DOJO_DB_VERSION_TAG}"
              dockerfile="./docker/my-dojo/mysql/Dockerfile"
              context="."
              build_args=""
              ;;
            soroban)
              repository="dojo-soroban"
              version="${DOJO_SOROBAN_VERSION_TAG}"
              dockerfile="./docker/my-dojo/soroban/Dockerfile"
              context="./docker/my-dojo/soroban"
              # Umbrel runs app containers as 1000:1000, so the soroban user
              # must be that UID or it cannot write its own home, data dir or
              # Tor state. The bundled Tor user just needs to be different.
              build_args=$'SOROBAN_LINUX_UID=1000\nSOROBAN_LINUX_GID=1000\nSOROBAN_TOR_LINUX_UID=1001\nSOROBAN_TOR_LINUX_GID=1001'
              ;;
            nginx)
              repository="dojo-nginx"
              version="${DOJO_VERSION_TAG}"
              dockerfile="./umbrel/images/nginx/Dockerfile"
              context="./umbrel/images/nginx"
              build_args=""
              ;;
          esac

          {
            echo "repository=${repository}"
            echo "tag=${version}-${revision}"
            echo "dockerfile=${dockerfile}"
            echo "context=${context}"
            echo "build_args<<EOF"
            echo "${build_args}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate install-time files
        run: ./umbrel/scripts/prepare-build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.settings.outputs.context }}
          file: ${{ steps.settings.outputs.dockerfile }}
          build-args: ${{ steps.settings.outputs.build_args }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.settings.outputs.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: ${{ matrix.image }} manifest
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [nodejs, db, soroban, nginx]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image reference
        id: settings
        run: |
          set -euo pipefail
          set -a
          . ./docker/my-dojo/.env
          set +a

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            revision="${GITHUB_REF_NAME#*-}"
          else
            revision="dev.${GITHUB_SHA::7}"
          fi

          case "${{ matrix.image }}" in
            nodejs)  repository="dojo-nodejs";  version="${DOJO_NODEJS_VERSION_TAG}" ;;
            db)      repository="dojo-db";      version="${DOJO_DB_VERSION_TAG}" ;;
            soroban) repository="dojo-soroban"; version="${DOJO_SOROBAN_VERSION_TAG}" ;;
            nginx)   repository="dojo-nginx";   version="${DOJO_VERSION_TAG}" ;;
          esac

          {
            echo "image=${REGISTRY}/${{ github.repository_owner }}/${repository}"
            echo "tag=${version}-${revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="${{ steps.settings.outputs.image }}"
          tag="${{ steps.settings.outputs.tag }}"

          sources=""
          for digest in *; do
            sources="${sources} ${image}@sha256:${digest}"
          done

          # shellcheck disable=SC2086
          docker buildx imagetools create --tag "${image}:${tag}" ${sources}

      - name: Report the pinned reference
        run: |
          set -euo pipefail
          image="${{ steps.settings.outputs.image }}"
          tag="${{ steps.settings.outputs.tag }}"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "${image}:${tag}" | tr -d '"')"

          echo "### ${image}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${image}:${tag}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "Platforms:" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${image}:${tag}" \
            | sed -n 's/^ *Platform: */- /p' >> "$GITHUB_STEP_SUMMARY"
